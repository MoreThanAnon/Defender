services:
  postfix:
    image: boky/postfix
    container_name: postfix
    restart: always
    environment:
      - MAILNAME=yourdomain.com
      - SMTP_SERVER=smtp.yourdomain.com
      - SMTP_PORT=587
      - SMTP_USERNAME=no-reply@yourdomain.com
      - SMTP_PASSWORD=yourpassword
    ports:
      - "25:25"
      - "587:587"
      - "465:465"